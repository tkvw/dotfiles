packages:
  - name: nushell # modern shell with structured data support
    scoop: nu
  - name: starship # cross-shell prompt
  - name: age # file encryption tool
  - name: sops # encrypted secrets manager for config files
  - name: mkcert # local TLS certificate generator
  - name: git # version control
  - name: atuin # shell history search and sync
  - name: zoxide # smarter cd that learns your most used directories
  - name: fd # fast file finder (find alternative)
  - name: carapace # multi-shell completion engine
    scoop: extras/carapace-bin
    scoop_bucket: extras
  - name: bottom # system monitor (top/htop alternative)
  - name: delta # syntax-highlighting diff viewer for git
  - name: ripgrep # fast recursive text search (grep alternative)
